<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../assets/logos/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../styles/forms.css">
  <title>IGesta</title>
</head>
<body>
  <section>
    <h1>Criar senha</h1>
    <form action="../criarSenhaEmpresa" method="post" id="confimarSenha">
      <input type="password" name="password" class="inputs" id="idPassword" placeholder="Senha" required minlength="8" autofocus pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^a-zA-Z0-9])\S+$" title="A senha deve ter 8 dígitos, 1 letra maiúscula, 1 letra minuscula, 1 número, 1 caractere especial">
      <input type="password" name="confirmPassword" class="inputs" id="idConfirmPassword" placeholder="Confirme a senha" required minlength="8" pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^a-zA-Z0-9])\S+$" title="A senha deve ter 8 dígitos, 1 letra maiúscula, 1 letra minuscula, 1 número, 1 caractere especial">
      <button class="buttons" id="buttonSubmit" onclick="senhaConfirmar()" type="button">Entrar</button>
    </form>
  </section>
  <div class="mens">
    <div>
      <h2>Estamos quase lá!</h2>
    </div>
  </div>
  <div class="back">
    <a href="../WEB-INF/view/forms-register.jsp">
      <img src="../assets/icons/arrow-left.png">
      <p>Voltar</p>
    </a>
  </div>
  <script src="../scripts/confimarSenhaEmpresa.js"></script>
</body>
</html>
