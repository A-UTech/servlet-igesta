<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../assets/logos/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../styles/forms.css">
  <title>IGesta</title>
</head>
<body>
  <section>
    <h1>Criar senha</h1>
    <form action="../criarSenhaEmpresa" method="post" id="confimarSenha">
      <div class="input-container">
        <input type="password" id="idPassword" name="password" placeholder="Senha" autocomplete="current-password" required pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^a-zA-Z0-9])\S+$" title="A senha deve conter pelo menos uma letra maiúscula, uma letra minúscula, um número, um caractere especial e não pode conter espaços.">
        <img onclick="mudarOlho('idPassword','toggleSenha')" src="../assets/icons/closed_eyes.png" alt="mostrar senha" class="eye-icon" id="toggleSenha">
      </div>
      <div class="input-container">
        <input type="password" id="idConfirmPassword" name="confirmPassword" placeholder="Senha" autocomplete="current-password" required>
        <img onclick="mudarOlho('idConfirmPassword','toggleSenha1')" src="../assets/icons/closed_eyes.png"
             alt="mostrar senha"
             class="eye-icon"
             id="toggleSenha1">
      </div>
      <button class="buttons" id="buttonSubmit" onclick="senhaConfirmar()" type="button">Definir senha</button>
    </form>
  </section>
  <div class="mens">
    <div>
      <h2>Estamos quase lá!</h2>
    </div>
  </div>
  <div class="back">
    <a href="../entrarCadastroEmpresa">
      <img src="../assets/icons/arrow-left.png">
      <p>Voltar</p>
    </a>
  </div>
  <script src="../scripts/confimarSenhaEmpresa.js"></script>
  <script src="../scripts/olhinhoInputs.js"></script>
</body>
</html>
